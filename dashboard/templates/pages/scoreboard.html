<!DOCTYPE html>
<html>
    {%include "head.html" %}
    <body>
        {%include "sections/header.html" %}
        <div class="container">
            <div class="row my-3">
                <div class="col-2">
                    <a class="btn btn-danger" onclick="deleteRobotCars()">
                        <i class="bi bi-trash"></i>
                    </a>
                    <a class="btn btn-primary" onclick="syncRobotCars()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </a>
                </div>
                <div class="col">
                    <div class="row">
                        <div class="col">
                            <select class="form-select" id="modulePicker">
                                <option>LineTracking</option>
                                <option>ObstacleAvoidance</option>
                                <option>ColorPath</option>
                            </select>
                        </div>
                        <div class="col">
                            <div class="row">
                                <div class="col">
                                    <a onclick="startAllSelectedCars()" class="btn btn-primary">Start geselecteerde robots</a>
                                </div>
                                <div class="col">
                                    <a onclick="startAllCars()" class="btn btn-primary">Start alle robots</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="robotCarContainer row">
                
            </div>
        </div>
        <script src="{{url_for('static', filename='functions.js')}}" rel="script"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </body>
</html>
